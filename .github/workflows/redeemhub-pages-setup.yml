name: Prepare Pages source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed Pages path fixes
        run: |
          echo '' | base64 --decode > /tmp/pages.patch
          git apply --check /tmp/pages.patch
          git apply /tmp/pages.patch
      - name: Install and verify
        run: npm ci && npm run typecheck && npm run build
        env:
          VITE_SUPABASE_URL: https://mjbzflykeohafiowvlui.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_iXTYqZp14tJLUjOlrG8Mdg_CAclRYMz
      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- vite.config.ts index.html public/manifest.webmanifest public/sw.js src/main.tsx src/App.tsx
          git diff --cached --quiet || git commit -m 'Support GitHub Pages project paths'
          git push origin HEAD:main
